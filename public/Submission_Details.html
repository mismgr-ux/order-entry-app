<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Submission Details</title>
<style>
  body {
    background: #eeeeea;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    background: #fff;
    max-width: 560px;
    width: 100%;
    padding: 32px;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  h1 {
    color: #1b3a2b;
    margin: 0 0 6px;
    font-size: 26px;
  }
  .subtitle {
    color: #4a6b57;
    margin: 0 0 24px;
    font-size: 14px;
  }
  label {
    display: block;
    font-weight: bold;
    color: #1b3a2b;
    margin-bottom: 6px;
    margin-top: 18px;
    font-size: 14px;
  }
  label .req { color: #b23b3b; }
  input[type=text], input[type=tel], input[type=email], input[type=number], input[type=date], select, textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    background: #faf6ec;
    border: 1px solid #d8d2c2;
    border-radius: 4px;
    font-size: 14px;
  }
  input[type=file] {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    background: #faf6ec;
    border: 1px solid #d8d2c2;
    border-radius: 4px;
    font-size: 14px;
  }
  textarea { resize: vertical; min-height: 60px; }
  .section-title {
    margin-top: 28px;
    padding-top: 14px;
    border-top: 1px solid #e2ddd0;
    font-size: 15px;
    font-weight: bold;
    color: #2e6b52;
  }
  button {
    margin-top: 26px;
    width: 100%;
    background: #2e6b52;
    color: #fff;
    border: none;
    padding: 14px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background: #255a44; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #msg { margin-top: 14px; font-size: 14px; text-align: center; }
  #msg.success { color: #2e6b52; }
  #msg.error { color: #b23b3b; }
</style>
</head>
<body>
  <div class="card">
    <h1>Submission Details</h1>
    <p class="subtitle">Candidate ki poori details bharein</p>

    <form id="subForm">
      <label>Email Address</label>
      <input type="email" name="email_address">

      <label>Applicant Name <span class="req">*</span></label>
      <input type="text" name="applicant_name" required>

      <label>Gender</label>
      <select name="gender">
        <option value="" selected hidden>Choose</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>

      <label>Contact Number <span class="req">*</span></label>
      <input type="tel" name="contact_number" required>

      <label>Email</label>
      <input type="email" name="email">

      <label>Highest Education</label>
      <input type="text" name="highest_education">

      <label>Position Applied For</label>
      <select name="position_applied_for">
        <option value="" selected hidden>Choose</option>
        <option value="SALES REPRESENTATIVE">SALES REPRESENTATIVE</option>
        <option value="NEW BUSINESS DEVELOPMENT">NEW BUSINESS DEVELOPMENT</option>
        <option value="AREA SALES MANAGER">AREA SALES MANAGER</option>
        <option value="NATIONAL SALES MANAGER">NATIONAL SALES MANAGER</option>
        <option value="EXECUTIVE - HOD">EXECUTIVE - HOD</option>
        <option value="HR MANAGER">HR MANAGER</option>
        <option value="PURCHASE EXECUTIVE">PURCHASE EXECUTIVE</option>
        <option value="CUSTOMER RELATIONSHIP MANAGER">CUSTOMER RELATIONSHIP MANAGER</option>
        <option value="CUSTOMER RELATIONSHIP EXECUTIVE">CUSTOMER RELATIONSHIP EXECUTIVE</option>
        <option value="ACCOUNTS EXECUTIVE">ACCOUNTS EXECUTIVE</option>
        <option value="EXPORT DOCUMENTATION EXECUTIVE">EXPORT DOCUMENTATION EXECUTIVE</option>
        <option value="SUPPLY CHAIN EXECUTIVE">SUPPLY CHAIN EXECUTIVE</option>
        <option value="EXECUTIVE ASSISTANT AND HR">EXECUTIVE ASSISTANT AND HR</option>
        <option value="PROMOTER">PROMOTER</option>
        <option value="CRM & BD EXECUTIVE">CRM &amp; BD EXECUTIVE</option>
        <option value="MT SALES HEAD">MT SALES HEAD</option>
        <option value="SALES OFFICER">SALES OFFICER</option>
        <option value="ACCOUNTS HEAD">ACCOUNTS HEAD</option>
        <option value="MODERN TRADE JUNIOR EXECUTIVE">MODERN TRADE JUNIOR EXECUTIVE</option>
        <option value="SALES EXECUTIVE">SALES EXECUTIVE</option>
        <option value="EXPORT HEAD">EXPORT HEAD</option>
        <option value="GODOWN INCHARGE">GODOWN INCHARGE</option>
        <option value="SALES COORDINATOR">SALES COORDINATOR</option>
        <option value="PROCESS COORDINATOR">PROCESS COORDINATOR</option>
        <option value="MD">MD</option>
        <option value="PRODUCTION HEAD">PRODUCTION HEAD</option>
        <option value="SUPPLY CHAIN MANAGER">SUPPLY CHAIN MANAGER</option>
        <option value="PROCUREMENT & OPERATIONS EXECUTIVE">PROCUREMENT &amp; OPERATIONS EXECUTIVE</option>
        <option value="MIS EXECUTIVE">MIS EXECUTIVE</option>
        <option value="GRAPHIC DESIGNER">GRAPHIC DESIGNER</option>
        <option value="QUALITY ANALYST">QUALITY ANALYST</option>
        <option value="ZONAL SALES MANAGER">ZONAL SALES MANAGER</option>
        <option value="PRIMARY">PRIMARY</option>
        <option value="PLANNING EXECUTIVE">PLANNING EXECUTIVE</option>
        <option value="LOGISTICS">LOGISTICS</option>
        <option value="SALES REPRESENTATIVE (KB)">SALES REPRESENTATIVE (KB)</option>
        <option value="ASM - SMT">ASM - SMT</option>
        <option value="JUNIOR ACCOUNTS EXECUTIVE">JUNIOR ACCOUNTS EXECUTIVE</option>
        <option value="SENIOR ASM">SENIOR ASM</option>
        <option value="CRR">CRR</option>
        <option value="INTERN RECRUITER">INTERN RECRUITER</option>
        <option value="SALES CO-ORDINATOR AND MARKETING EXECUTIVE">SALES CO-ORDINATOR AND MARKETING EXECUTIVE</option>
        <option value="CORPORATE TRAINER">CORPORATE TRAINER</option>
        <option value="HR INTERN">HR INTERN</option>
        <option value="NEW BUSINESS DEVELOPMENT (Pan India)">NEW BUSINESS DEVELOPMENT (Pan India)</option>
        <option value="SMT">SMT SO</option>
      </select>

      <label>HR Name</label>
      <select name="hr_name">
        <option value="" selected hidden>Choose</option>
        <option value="HR">HR</option>
        <option value="Recruiter">Recruiter</option>
      </select>

      <label>Source</label>
      <select name="source">
        <option value="" selected hidden>Choose</option>
        <option value="Naukri.com">Naukri.com</option>
        <option value="Consultant">Consultant</option>
        <option value="Referral">Referral</option>
        <option value="Social Media">Social Media</option>
        <option value="Website">Website</option>
        <option value="Job Hai">Job Hai</option>
        <option value="Indeed">Indeed</option>
        <option value="Work India">Work India</option>
        <option value="Shine.com">Shine.com</option>
      </select>

      <label>Contact Date</label>
      <input type="date" name="contact_date">

      <label>Total Experience (years)</label>
      <input type="number" step="0.01" name="total_experience">

      <label>Last Salary</label>
      <input type="number" step="0.01" name="last_salary">

      <label>Expected Salary</label>
      <input type="number" step="0.01" name="expected_salary">

      <label>Resume</label>
      <input type="file" name="resume_file" accept="application/pdf,image/*,.doc,.docx" capture="environment">

      <div class="section-title">Hiring Progress</div>

      <label>Stage</label>
      <select name="stage">
        <option value="" selected hidden>Choose</option>
        <option value="Interview">Interview</option>
        <option value="Shortlist">Shortlist</option>
        <option value="Reject">Reject</option>
        <option value="Join">Join</option>
        <option value="Offer Provided">Offer Provided</option>
        <option value="Screening">Screening</option>
        <option value="HR Round">HR Round</option>
        <option value="Offer Accepted">Offer Accepted</option>
        <option value="Moved Out">Moved Out</option>
      </select>

      <label>Offer Date</label>
      <input type="date" name="offer_date">

      <label>DOJ (Date of Joining)</label>
      <input type="date" name="doj">

      <label>Salary Offered</label>
      <input type="number" step="0.01" name="salary_offered">

      <label>Decline Reasons</label>
      <select name="decline_reasons">
        <option value="" selected hidden>Choose</option>
        <option value="Technical">Technical</option>
        <option value="Experience">Experience</option>
        <option value="Salary">Salary</option>
        <option value="Others">Others</option>
      </select>

      <label>Decline Remark</label>
      <textarea name="decline_remark"></textarea>

      <label>Remarks of SS/HR</label>
      <textarea name="remarks_of_ss_hr"></textarea>

      <label>Remarks of Reporting Manager</label>
      <textarea name="remarks_of_reporting_manager"></textarea>

      <button type="submit" id="submitBtn">Submit</button>
      <div id="msg"></div>
    </form>
  </div>

<script>
const form = document.getElementById('subForm');
const msg = document.getElementById('msg');
const btn = document.getElementById('submitBtn');

function compressImage(file, maxWidth = 1600, quality = 0.7) {
  return new Promise((resolve) => {
    if (!file.type.startsWith('image/')) { resolve(file); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxWidth) { height = Math.round(height * (maxWidth / width)); width = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          resolve(new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' }));
        }, 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true;
  btn.textContent = 'Submitting...';
  msg.textContent = '';
  msg.className = '';

  try {
    const formData = new FormData(form);
    const resumeInput = form.querySelector('[name="resume_file"]');
    if (resumeInput.files[0]) {
      const compressed = await compressImage(resumeInput.files[0]);
      formData.set('resume_file', compressed, compressed.name);
    }

    const res = await fetch('/submit-submission-details', { method: 'POST', body: formData });
    const data = await res.json();

    if (data.success) {
      msg.textContent = 'Safaltapoorvak save ho gaya!';
      msg.className = 'success';
      form.reset();
    } else {
      msg.textContent = data.message || 'Kuch galat ho gaya.';
      msg.className = 'error';
    }
  } catch (err) {
    msg.textContent = 'Server se connect nahi ho paaya.';
    msg.className = 'error';
  }

  btn.disabled = false;
  btn.textContent = 'Submit';
});
</script>
</body>
</html>
