<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Submission Details</title>
<style>
  body {
    background: #eeeeea;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    background: #fff;
    max-width: 560px;
    width: 100%;
    padding: 32px;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  h1 {
    color: #1b3a2b;
    margin: 0 0 6px;
    font-size: 26px;
  }
  .subtitle {
    color: #4a6b57;
    margin: 0 0 24px;
    font-size: 14px;
  }
  label {
    display: block;
    font-weight: bold;
    color: #1b3a2b;
    margin-bottom: 6px;
    margin-top: 18px;
    font-size: 14px;
  }
  label .req { color: #b23b3b; }
  input[type=text], input[type=tel], input[type=email], input[type=number], input[type=date], select, textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    background: #faf6ec;
    border: 1px solid #d8d2c2;
    border-radius: 4px;
    font-size: 14px;
  }
  input[type=file] {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    background: #faf6ec;
    border: 1px solid #d8d2c2;
    border-radius: 4px;
    font-size: 14px;
  }
  textarea { resize: vertical; min-height: 60px; }
  .section-title {
    margin-top: 28px;
    padding-top: 14px;
    border-top: 1px solid #e2ddd0;
    font-size: 15px;
    font-weight: bold;
    color: #2e6b52;
  }
  button {
    margin-top: 26px;
    width: 100%;
    background: #2e6b52;
    color: #fff;
    border: none;
    padding: 14px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background: #255a44; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #msg { margin-top: 14px; font-size: 14px; text-align: center; }
  #msg.success { color: #2e6b52; }
  #msg.error { color: #b23b3b; }
</style>
</head>
<body>
  <div class="card">
    <h1>Submission Details</h1>
    <p class="subtitle">Candidate ki poori details bharein</p>

    <form id="subForm">
      <label>Email Address</label>
      <input type="email" name="email_address">

      <label>Applicant Name <span class="req">*</span></label>
      <input type="text" name="applicant_name" required>

      <label>Gender</label>
      <select name="gender">
        <option value="">-- Select --</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>

      <label>Contact Number <span class="req">*</span></label>
      <input type="tel" name="contact_number" required>

      <label>Email</label>
      <input type="email" name="email">

      <label>Highest Education</label>
      <input type="text" name="highest_education">

      <label>Position Applied For</label>
      <input type="text" name="position_applied_for">

      <label>HR Name</label>
      <input type="text" name="hr_name">

      <label>Source</label>
      <input type="text" name="source" placeholder="e.g. Naukri, LinkedIn, Referral">

      <label>Contact Date</label>
      <input type="date" name="contact_date">

      <label>Total Experience (years)</label>
      <input type="number" step="0.01" name="total_experience">

      <label>Last Salary</label>
      <input type="number" step="0.01" name="last_salary">

      <label>Expected Salary</label>
      <input type="number" step="0.01" name="expected_salary">

      <label>Resume</label>
      <input type="file" name="resume_file" accept="application/pdf,image/*,.doc,.docx" capture="environment">

      <div class="section-title">Hiring Progress</div>

      <label>Stage</label>
      <select name="stage">
        <option value="">-- Select --</option>
        <option value="Screening">Screening</option>
        <option value="Interview Scheduled">Interview Scheduled</option>
        <option value="Interviewed">Interviewed</option>
        <option value="Offered">Offered</option>
        <option value="Joined">Joined</option>
        <option value="Rejected">Rejected</option>
        <option value="Declined by Candidate">Declined by Candidate</option>
      </select>

      <label>Offer Date</label>
      <input type="date" name="offer_date">

      <label>DOJ (Date of Joining)</label>
      <input type="date" name="doj">

      <label>Salary Offered</label>
      <input type="number" step="0.01" name="salary_offered">

      <label>Decline Reasons</label>
      <textarea name="decline_reasons"></textarea>

      <label>Decline Remark</label>
      <textarea name="decline_remark"></textarea>

      <label>Remarks of SS/HR</label>
      <textarea name="remarks_of_ss_hr"></textarea>

      <label>Remarks of Reporting Manager</label>
      <textarea name="remarks_of_reporting_manager"></textarea>

      <button type="submit" id="submitBtn">Submit</button>
      <div id="msg"></div>
    </form>
  </div>

<script>
const form = document.getElementById('subForm');
const msg = document.getElementById('msg');
const btn = document.getElementById('submitBtn');

function compressImage(file, maxWidth = 1600, quality = 0.7) {
  return new Promise((resolve) => {
    if (!file.type.startsWith('image/')) { resolve(file); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxWidth) { height = Math.round(height * (maxWidth / width)); width = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          resolve(new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' }));
        }, 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true;
  btn.textContent = 'Submitting...';
  msg.textContent = '';
  msg.className = '';

  try {
    const formData = new FormData(form);
    const resumeInput = form.querySelector('[name="resume_file"]');
    if (resumeInput.files[0]) {
      const compressed = await compressImage(resumeInput.files[0]);
      formData.set('resume_file', compressed, compressed.name);
    }

    const res = await fetch('/submit-submission-details', { method: 'POST', body: formData });
    const data = await res.json();

    if (data.success) {
      msg.textContent = 'Safaltapoorvak save ho gaya!';
      msg.className = 'success';
      form.reset();
    } else {
      msg.textContent = data.message || 'Kuch galat ho gaya.';
      msg.className = 'error';
    }
  } catch (err) {
    msg.textContent = 'Server se connect nahi ho paaya.';
    msg.className = 'error';
  }

  btn.disabled = false;
  btn.textContent = 'Submit';
});
</script>
</body>
</html>
