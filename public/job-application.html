<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Job Application</title>
<style>
  body {
    background: #eeeeea;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    background: #fff;
    max-width: 560px;
    width: 100%;
    padding: 32px;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  h1 {
    color: #1b3a2b;
    margin: 0 0 6px;
    font-size: 26px;
  }
  .subtitle {
    color: #4a6b57;
    margin: 0 0 24px;
    font-size: 14px;
  }
  label {
    display: block;
    font-weight: bold;
    color: #1b3a2b;
    margin-bottom: 6px;
    margin-top: 18px;
    font-size: 14px;
  }
  label .req { color: #b23b3b; }
  input[type=text], input[type=tel], input[type=email], textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    background: #faf6ec;
    border: 1px solid #d8d2c2;
    border-radius: 4px;
    font-size: 14px;
  }
  input[type=file] {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    background: #faf6ec;
    border: 1px solid #d8d2c2;
    border-radius: 4px;
    font-size: 14px;
  }
  textarea { resize: vertical; min-height: 70px; }
  button {
    margin-top: 26px;
    width: 100%;
    background: #2e6b52;
    color: #fff;
    border: none;
    padding: 14px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background: #255a44; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #msg { margin-top: 14px; font-size: 14px; text-align: center; }
  #msg.success { color: #2e6b52; }
  #msg.error { color: #b23b3b; }
</style>
</head>
<body>
  <div class="card">
    <h1>Job Application</h1>
    <p class="subtitle">Apni details bharein</p>

    <form id="jobForm">
      <label>Name <span class="req">*</span></label>
      <input type="text" name="name" required>

      <label>Contact Number <span class="req">*</span></label>
      <input type="tel" name="contact_number" required>

      <label>Email ID</label>
      <input type="email" name="email">

      <label>Address</label>
      <textarea name="address"></textarea>

      <label>Position Applied For <span class="req">*</span></label>
      <input type="text" name="position_applied_for" required>

      <label>Education</label>
      <textarea name="education"></textarea>

      <label>Work Experience</label>
      <textarea name="work_experience"></textarea>

      <label>Resume <span class="req">*</span></label>
      <input type="file" name="resume_file" accept="application/pdf,image/*,.doc,.docx" required>

      <label>Why do you want to work for our company?</label>
      <textarea name="why_join"></textarea>

      <button type="submit" id="submitBtn">Submit Application</button>
      <div id="msg"></div>
    </form>
  </div>

<script>
const form = document.getElementById('jobForm');
const msg = document.getElementById('msg');
const btn = document.getElementById('submitBtn');

function compressImage(file, maxWidth = 1600, quality = 0.7) {
  return new Promise((resolve) => {
    if (!file.type.startsWith('image/')) {
      resolve(file);
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxWidth) {
          height = Math.round(height * (maxWidth / width));
          width = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          resolve(new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' }));
        }, 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true;
  btn.textContent = 'Submitting...';
  msg.textContent = '';
  msg.className = '';

  try {
    const formData = new FormData(form);
    const resumeInput = form.querySelector('[name="resume_file"]');
    if (resumeInput.files[0]) {
      const compressed = await compressImage(resumeInput.files[0]);
      formData.set('resume_file', compressed, compressed.name);
    }

    const res = await fetch('/submit-job', { method: 'POST', body: formData });
    const data = await res.json();

    if (data.success) {
      msg.textContent = 'Application safaltapoorvak submit ho gayi!';
      msg.className = 'success';
      form.reset();
    } else {
      msg.textContent = data.message || 'Kuch galat ho gaya.';
      msg.className = 'error';
    }
  } catch (err) {
    msg.textContent = 'Server se connect nahi ho paaya.';
    msg.className = 'error';
  }

  btn.disabled = false;
  btn.textContent = 'Submit Application';
});
</script>
</body>
</html>
